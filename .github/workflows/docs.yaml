name: Docs
# Builds the docs website (website/, Astro) from docs/ and publishes it on GitHub Pages.
# The repository settings must use "GitHub Actions" as the source of GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "editors/vscode/syntaxes/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The full history gives the "Last updated" date of each page.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the site and check its links
        working-directory: website
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
