[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
phemc-syntax = { path = "crates/phemc-syntax" }
phemc-twig-scan = { path = "crates/phemc-twig-scan" }
phemc-analyze = { path = "crates/phemc-analyze" }
phemc-codegen = { path = "crates/phemc-codegen" }
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
insta = "1"
miette = { version = "7", features = ["fancy"] }
notify = "8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = "thin"
