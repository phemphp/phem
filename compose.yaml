# Run it from the root of the package: `make test`, `make shell`.
# The image is the dev image of phem (built from ../../phem). The bundle does not use the
# entrypoint of the image, which builds phemc from the phem sources: PHEMC_BIN is empty, so
# vendor/bin/phemc runs the phemc binary of the installed phem/phem release (it downloads it on
# the first run). The parent directory of the repositories is mounted at /work.
name: phem-ui-base

services:
  dev:
    build: { context: ../../phem, dockerfile: docker/Dockerfile }
    working_dir: /work/ui/base
    entrypoint: []
    command: vendor/bin/phpunit
    environment:
      PHEMC_BIN: ""
    ports:
      - "8100:8000"
    volumes:
      - ../..:/work

  # The browser tests of the demo (`make test-e2e`): the e2e image of phem, with Node.js and the
  # Chromium of Playwright. Playwright PHP sends the requests of the browser to the kernel of the
  # demo, in the PHPUnit process, so no web server runs.
  e2e:
    build:
      context: ../../phem
      dockerfile: e2e/Dockerfile
      additional_contexts: { dev: "service:dev" }
    working_dir: /work/ui/base/demo
    command: bin/test
    # PHPUnit is the last process of bin/test: as PID 1, it would not stop on Ctrl-C.
    init: true
    entrypoint: []
    environment:
      PHEMC_BIN: ""
    volumes:
      - ../..:/work
