# The version of the plugin.
pluginVersion = 0.1.0

# Build against the local PhpStorm. This does not download the IDE.
phpstormPath = /Applications/PhpStorm.app

# The oldest PhpStorm that the plugin supports. It gives sinceBuild (2026.2 -> 262). Publish a
# build against this version (make phpstorm-publish), so that the plugin uses no newer API.
phpstormMinVersion = 2026.2

# Set to true to verify the plugin against all the PhpStorm versions that it supports.
verifyRecommended = false

# Set a version (for example 2026.2) to download PhpStorm and build against it.
# A version overrides phpstormPath.
phpstormVersion =

# The directory with phem-lsp.cjs and phem-lsp.wasm, relative to this directory.
phemServerDir = ../server

# The VS Code extension. The build copies its grammar and its icon.
phemVscodeDir = ../vscode

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
