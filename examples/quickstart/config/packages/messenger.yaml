# The work of the #[Async] event handlers goes to the `async` transport: a table of the SQLite
# database (doctrine:schema:create makes it). `bin/console messenger:consume async` runs it (the
# `worker` of the dev and prod containers). Use Redis or AMQP in production: the Doctrine
# transport polls the database.
framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: 'doctrine://default?queue_name=async'
                retry_strategy:
                    max_retries: 2
            failed: 'doctrine://default?queue_name=failed'
        routing:
            Phem\Async\AsyncHandlerMessage: async
