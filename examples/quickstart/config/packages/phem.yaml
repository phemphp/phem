# phemc reads src/ and writes var/cache/phem/ (the defaults).
phem:
    source_dir: '%kernel.project_dir%/src'
    build_dir: '%kernel.project_dir%/var/cache/phem'
    # The Mercure hub of FrankenPHP (see the Caddyfile), for the pages with #[Subscribe]. With
    # the subscriber key, the updates are private: each page gets an access token for its topics.
    mercure:
        subscriber_key: '%env(MERCURE_SUBSCRIBER_JWT_KEY)%'
        # The worker of the #[Async] handlers has no FrankenPHP request: it publishes with the
        # HTTP API of the hub, with the publisher key.
        publisher_key: '%env(MERCURE_PUBLISHER_JWT_KEY)%'
        publish_url: '%env(MERCURE_PUBLISH_URL)%'
