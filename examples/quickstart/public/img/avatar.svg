<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Avatar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58c4dc"/>
      <stop offset="1" stop-color="#087ea4"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="60" cy="60" r="60"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="120" height="120" fill="url(#bg)"/>
    <!-- hair (back) -->
    <path d="M28 64c0-24 14-40 32-40s32 16 32 40c0 14-4 26-8 34H36c-4-8-8-20-8-34z" fill="#3b2a24"/>
    <!-- shoulders -->
    <path d="M18 124c2-22 20-34 42-34s40 12 42 34z" fill="#f6f7f9"/>
    <path d="M48 92h24l-12 14z" fill="#e3c4a8"/>
    <!-- neck -->
    <rect x="52" y="74" width="16" height="20" rx="6" fill="#e3c4a8"/>
    <!-- face -->
    <ellipse cx="60" cy="58" rx="19" ry="22" fill="#f1d3b8"/>
    <!-- hair (front) -->
    <path d="M40 54c2-16 12-24 22-24 10 0 18 8 19 20-8-2-18-8-23-16-4 10-10 16-18 20z" fill="#3b2a24"/>
    <!-- eyes and mouth -->
    <circle cx="52" cy="60" r="2.2" fill="#23272f"/>
    <circle cx="68" cy="60" r="2.2" fill="#23272f"/>
    <path d="M53 70c4 4 10 4 14 0" fill="none" stroke="#b5524c" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
