framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    asset_mapper:
        paths: ['assets/']

twig:
    strict_variables: true

symfonycasts_tailwind:
    binary_version: 'v4.1.11'

phem:
    class_merger:
        tailwind:
            css: '%kernel.project_dir%/assets/styles/app.css'
